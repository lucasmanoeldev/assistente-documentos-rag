services:
  - type: web
    name: assistente-documentos-rag
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn rag_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

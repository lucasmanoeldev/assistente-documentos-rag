[project]
name = "assistente-de-documentos-com-rag"
version = "2.0.0"
description = "Assistente de Documentos com RAG - Django + LangChain Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "django>=5.0",
    "djangorestframework>=3.15",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.1.0",
    "langchain-openai>=0.3.0",
    "langchain-huggingface>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "faiss-cpu>=1.9.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=5.0.0",
    "gunicorn>=21.2.0",
    "whitenoise>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
]
